// PREMIUM: POINTS SHOP OFFERS
// Master switches: premium_points_enable, premium_points_shop.
// Individual rentals: premium_points_rentals. Paid trials: premium_points_trials.
// These switches and the lifetime trial limit live in premium_rebuilt.cfg.
// Players: !shop / !premium_shop. Reload offers: sm_premium_shop_reload.
//
// enabled  : 0 hide this offer, 1 offer it when its category is enabled.
// feature  : an individual feature key, or trial for FULL Premium trial access.
// price    : points charged once, after confirmation.
// duration : whole-number length. unit: minutes, hours, or days.
// Maximum: one year per offer. Offline/disabled time still counts.
// You may copy an offer for a second duration; give it a UNIQUE lowercase ID.

"PremiumShop"
{
    "Items"
    {
        // INDIVIDUAL RENTALS: feature only; no membership or chat tag.
        "glow_hour"
        {
            "enabled"  "1"
            "name"     "Glow for an hour"
            "feature"  "glow"
            "price"    "10"
            "duration" "1"
            "unit"     "hours"
        }

        "airblast_hour"
        {
            "enabled"  "1"
            "name"     "Airblast jump for an hour"
            "feature"  "airblast"
            "price"    "10"
            "duration" "1"
            "unit"     "hours"
        }

        "ammo_day"
        {
            "enabled"  "1"
            "name"     "Extra reserve ammo for a day"
            "feature"  "ammo"
            "price"    "50"
            "duration" "1"
            "unit"     "days"
        }

        // FULL PREMIUM TRIAL: subject to the shared lifetime purchase limit.
        // Separate from the free-trial system and its one-time eligibility.
        "trial_hour"
        {
            "enabled"  "1"
            "name"     "Premium trial for an hour"
            "feature"  "trial"
            "price"    "30"
            "duration" "1"
            "unit"     "hours"
        }

    }
}
